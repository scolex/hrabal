<!doctype html>
<html lang="{{ config.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url('neat.css') }}">
  <link rel="stylesheet" href="{{ get_url('style.css') }}">
  <script src="{{ get_url('theme.js') }}"></script>
</head>
<body>
  <header>
    <a class="site-title" href="{{ get_url('/') }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url('@/blog/_index.md') }}">Blog</a>
      <a href="{{ get_url('/tags/') }}">Tags</a>
      <a href="{{ get_url('@/about.md') }}">About</a>
      <button class="theme-switch" type="button" title="Switch between light and dark">◐</button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    {{ config.extra.author }}
  </footer>
</body>
</html>

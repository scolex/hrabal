base_url = "https://example.com"
title = "My site"
description = "A site made with hrabal"
author = "Your Name"
taxonomies = ["tags"]
highlight_theme = "monokai"
insert_anchor_links = "right"
language = "cs" # "en" switches everything hrabal writes to English
generate_feeds = true
build_search_index = true

# hrabal's own look. Any of its templates or static files can be replaced by putting a file
# of the same name in templates/ or static/ here, the rest comes from hrabal.
[theme]
menu = [
    { title = "Blog", url = "@/blog/_index.md" },
    { title = "Štítky", url = "/tags/" },
    { title = "O webu", url = "@/about.md" },
]
home_posts = "blog/_index.md" # the section whose newest posts the home page lists
icon = "icon.svg" # shown before the title and as the favicon, "" for none
copyright_since = 2024 # the first year in the footer, the last one is always this year
breadcrumbs = true # Úvod › Blog over the heading of a post

# hrabal writes its words in the site's language, and any of them can be changed here:
# [translations.cs]
# newer = "Mladší"

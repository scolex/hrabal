{% extends "base.html" %}

{% block title %}{{ taxonomy.name | title }} · {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ taxonomy.name | title }}</h1>
<ul>
  {% for term in taxonomy.terms.values() %}
  <li><a href="{{ term.permalink }}">{{ term.name }}</a> ({{ term.pages | length }})</li>
  {% endfor %}
</ul>
{% endblock %}

{% macro post_list(pages) %}
<ul class="posts">
  {% for page in pages %}
  <li>
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    {% if page.date %}<time>{{ page.date | date(trans("date_long")) }}</time>{% endif %}
    {% if page.summary %}<div class="summary">{{ page.summary | safe }}</div>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endmacro %}

<!doctype html>
<html lang="{{ config.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  {% if config.extra.icon %}
  <link rel="icon" href="{{ get_url(config.extra.icon) }}"{% if config.extra.icon.endswith(".svg") %} type="image/svg+xml"{% endif %}>
  {% endif %}
  <link rel="stylesheet" href="{{ get_url('neat.css') }}">
  <link rel="stylesheet" href="{{ get_url('style.css') }}">
  <script src="{{ get_url('theme.js') }}"></script>
  {% if config.generate_feeds %}
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url('atom.xml') }}">
  {% endif %}
  {% if (page and page.has_mermaid) or (section and section.has_mermaid) %}
  <script type="module" src="{{ get_url('mermaid.js') }}"></script>
  {% endif %}
</head>
<body>
  <header>
    <a class="site-title" href="{{ get_url('/') }}">
      {% if config.extra.icon %}<img src="{{ get_url(config.extra.icon) }}" alt="">{% endif %}
      {{ config.title }}
    </a>
    <nav>
      <a href="{{ get_url('@/blog/_index.md') }}">Blog</a>
      <a href="{{ get_url('/tags/') }}">Tags</a>
      <a href="{{ get_url('@/about.md') }}">About</a>
      <button class="theme-switch" type="button" title="Switch between light and dark">◐</button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    {{ config.author }}
  </footer>
</body>
</html>
